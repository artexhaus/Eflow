<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#FFFCF4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#3B3355;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFFCF4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:2px solid #E7E4EC;border-radius:24px;padding:32px;">
            <tr>
              <td>
                <div style="font-size:26px;font-weight:800;margin-bottom:4px;">Eflow</div>
                <div style="height:6px;border-radius:6px;background:linear-gradient(90deg,#ECA0A9 0 25%,#91B5D2 25% 50%,#8BCB9C 50% 75%,#F6E27A 75% 100%);margin-bottom:24px;"></div>
                <h1 style="font-size:22px;margin:0 0 8px;">Confirm your email</h1>
                <p style="font-size:16px;line-height:1.5;margin:0 0 24px;color:#5A5270;">
                  Thanks for signing up! Tap the button below to confirm this address and start tidying your inbox.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#B1DEBC;color:#3B3355;font-weight:700;font-size:16px;text-decoration:none;padding:14px 28px;border-radius:16px;border:2px solid #9CC9A8;">
                  Confirm my email
                </a>
                <p style="font-size:13px;line-height:1.5;margin:24px 0 0;color:#7A738C;">
                  If you didn't create an Eflow account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#7A738C;margin:16px 0 0;">
            Eflow by Artexhaus · <a href="https://www.eflowapp.org" style="color:#7A738C;">eflowapp.org</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
