project_id = "xqskistgkihlewsxanib"

[auth]
enable_signup = true
# Where Supabase sends people back after sign-up confirmation and password
# reset links. The app always asks to return to the page it's running on, and
# only addresses on this list are allowed.
site_url = "https://www.eflowapp.org"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "https://eflowapp.org",
  "https://eflowapp.org/**",
  "https://www.eflowapp.org/**",
]

[auth.email]
enable_signup = true
# New accounts must confirm their email address (emails are sent through
# Resend via the custom SMTP settings configured in the Supabase dashboard).
enable_confirmations = true

[auth.email.template.confirmation]
subject = "{{ $es := false }}{{ with .Data }}{{ if eq (printf \"%v\" .lang) \"es\" }}{{ $es = true }}{{ end }}{{ end }}{{ if $es }}Confirma tu cuenta de Eflow{{ else }}Confirm your Eflow account{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ $es := false }}{{ with .Data }}{{ if eq (printf \"%v\" .lang) \"es\" }}{{ $es = true }}{{ end }}{{ end }}{{ if $es }}Restablece tu contraseña de Eflow{{ else }}Reset your Eflow password{{ end }}"
content_path = "./supabase/templates/recovery.html"

[functions.imap-connect]
verify_jwt = true

[functions.imap-fetch]
verify_jwt = true

[functions.imap-apply-actions]
verify_jwt = true


[functions.unsubscribe]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

# Called by Stripe, which has no Supabase JWT; requests are verified by their
# Stripe-Signature header instead.
[functions.stripe-webhook]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
