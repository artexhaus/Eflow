<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Success - Eflow</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
    }
    .container {
      text-align: center;
      padding: 3rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 1rem;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 32px;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    p {
      font-size: 18px;
      opacity: 0.9;
      line-height: 1.6;
    }
    .details {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✅</div>
    <h1 id="title">Setting up your account...</h1>
    <p id="message">Please wait while we complete the setup.</p>
    <div class="details" id="details"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const oauthStatus = urlParams.get('oauth');
    const oauthProvider = urlParams.get('provider');
    const oauthError = urlParams.get('message');

    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const details = document.getElementById('details');

    if (oauthStatus === 'success') {
      title.textContent = 'Authentication Successful!';
      message.textContent = `Your ${oauthProvider || 'email'} account has been connected. You can close this window and return to the app.`;
      details.textContent = '✓ Account connected successfully\n✓ You can now close this window';

      // Try to close the window after 3 seconds
      setTimeout(() => {
        window.close();
        if (!window.closed) {
          details.textContent = 'Please close this window manually and return to the app.';
        }
      }, 3000);
    } else if (oauthStatus === 'error') {
      document.querySelector('.icon').textContent = '❌';
      title.textContent = 'Authentication Failed';
      message.textContent = oauthError || 'An error occurred during authentication.';
      details.textContent = 'Please close this window and try again.';
      document.querySelector('.container').style.background = 'rgba(239, 68, 68, 0.1)';
    } else {
      title.textContent = 'Processing...';
      message.textContent = 'Completing OAuth flow...';
    }
  </script>
</body>
</html>
